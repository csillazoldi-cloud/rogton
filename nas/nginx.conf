server {
    listen 80;
    server_name _;

    # A mappa vegi perjel potlasat relativ atiranyitassal kuldjuk, kulonben az
    # nginx sajat http:// cimet irna bele, es a latogato a rossz kiszolgalon kot ki.
    absolute_redirect off;
    port_in_redirect off;

    # E-34: a bongeszo ne engedjen titkositatlan kapcsolatot erre a gepnevre.
    # Szandekosan ROVID (1 nap) es includeSubDomains NELKUL, mert ez teszt kornyezet:
    # ha a tanusitvannyal baj lenne, egy nap alatt "elfelejtodik", nem egy evig.
    # A pilot elott ez 31536000-re (1 ev) emelendo — UZEMELTETES.md.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # V4 (2026-09-18, Vilmos 8.): a posztkep- es betu-feltoltes korlatja 10 MB.
    # Az nginx 12 MB-ig enged, hogy a 10 MB feletti fajl a KODHOZ erjen el,
    # es az mondja ki a valodi okot (TUL_NAGY 413) — ne a proxy vagja el
    # torzs nelkuli 413-mal, amibol a lap csak annyit lat, hogy "nem sikerult".
    # Ez marad az alap MINDEN utvonalra; csak az arculati fajl-feltoltes kap tobbet (lent).
    client_max_body_size 12m;

    # Csilla 2026-10-10: az arculati/szervezeti fajlok (PDF stb.) korlatja 100 MB (fajl-core MAX_MERET_BAJT).
    # 105 MB-ig enged, hogy a 100 MB feletti fajlt is a kod utasitsa el baratsagos TUL_NAGY 413-mal.
    # Az app a torzset darabonkent lemezre irja (apps/web/fajl/beolvas.ts), nem a memoriaba.
    # FIGYELEM: a DSM forditott proxy (elotte) sajat korlatot tarthat — UZEMELTETES / dontes 2026-10-10.
    location = /api/arculat/fajl {
        client_max_body_size 105m;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Az elo munkaallapot: statikus lap, az nginx maga adja (az app ujraepitese alatt is el).
    location = /allapot {
        return 301 /allapot/;
    }
    location /allapot/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location = /robots.txt {
        root /usr/share/nginx/html;
    }

    # A-12 (E-32): a masodik befogado rendszer. Sajat dobozban fut, sajat SQLite fajllal;
    # az utvonal-elotagot (/referencia) maga a host kezeli, ezert az utvonalat valtozatlanul adjuk tovabb.
    location = /referencia {
        return 301 /referencia/;
    }
    location /referencia/ {
        # Biztonsagi felulvizsgalat 2026-09-10 (K-02): a bemutato NYILVANOS, ezert csak olvashato.
        # Masodik fal az alkalmazas sajat tiltasa mellett (KM_REF_IRAS). Az utemezett napi futas
        # belulrol indul, azt ez nem erinti.
        limit_except GET HEAD { deny all; }
        # T-20 (2026-09-12): a nevet futas kozben oldjuk fel a Docker belso DNS-evel, nem indulaskor — igy ha a bemutato doboz
        # eppen nem fut, az nginx (es vele a fo alkalmazas) attol meg elindul; a /referencia/ addig 502-t ad, a tobbi lap megy.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $referencia_cim http://referencia:8600;
        proxy_pass $referencia_cim;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Minden mas: a Next.js alkalmazas.
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
