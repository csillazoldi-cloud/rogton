# A NAS-on futó tesztkörnyezet. Négy doboz:
#   db  — PostgreSQL 18 (csak belül; adatai az ./adatok/postgres mappában; jelszavak a NAS .env fájljában)
#   app — a Next.js alkalmazás (csak belül, a 3000-es porton)
#   web — nginx: a 127.0.0.1:8400-on felel, az /allapot/ lapot maga adja, minden mást az app-nak ad tovább
#   ai-hid — (D-10) a Claude Code és a Codex programok képernyő nélkül, a saját előfizetéses belépőjükkel;
#            csak belül, a 8500-as porton; a belépők a ./titkok mappából (a vaultból: kirak.sh --titkok)
#   referencia — (A-12, E-32) a MÁSODIK befogadó rendszer: ugyanaz a hírfigyelő mag Next és Postgres nélkül,
#            egy Node folyamat + egy SQLite fájl; csak belül, a 8600-as porton, az nginx /referencia/ alatt adja
# Szándékosan NINCS docker-szintű healthcheck: a 2026-09-06-i leállás valószínű oka
# az eltakarítatlan állapotellenőrző munkamenetek voltak (NAS-szabalyok.md).
name: aitmetica-saas
services:
  db:
    image: postgres:18-alpine
    container_name: aitmetica-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: km
      POSTGRES_USER: km_tulaj
      POSTGRES_PASSWORD: ${KM_TULAJ_JELSZO:?a NAS .env fájlból}
      KM_APP_JELSZO: ${KM_APP_JELSZO:?a NAS .env fájlból}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=hu-HU --encoding=UTF8"
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    volumes:
      - ./adatok/postgres:/var/lib/postgresql
      - ./forras/nas/adatbazis/init:/docker-entrypoint-initdb.d:ro
      - ./forras/nas/adatbazis/migral.sh:/migral/migral.sh:ro
      - ./forras/apps/web/adatbazis/migraciok:/migraciok:ro
    mem_limit: 384m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
  app:
    build:
      context: ./forras
      dockerfile: Dockerfile
    image: aitmetica-saas-app:helyi
    container_name: aitmetica-saas-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://km_app:${KM_APP_JELSZO}@db:5432/km
      # AI (E-7): teszt | anthropic — a kulcs a NAS .env fájljából; keret USD/hó
      AI_SZOLGALTATO: ${AI_SZOLGALTATO:-teszt}
      AI_MODELL: ${AI_MODELL:-claude-sonnet-5}
      AI_HAVI_KERET_USD: ${AI_HAVI_KERET_USD:-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # T-25 (D-F37): OpenAI API a hírfigyelőhöz — a kulcs a vault/openai-key.txt-ből (kirak.sh --titkok), a modell alap gpt-5-mini
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODELL: ${OPENAI_MODELL:-gpt-5-mini}
      # D-10: előfizetéses út — claude-elofizetes | codex-elofizetes az ai-hid dobozon át (belépők a ./titkok mappában)
      AI_HID_CIM: http://ai-hid:8500
      CLAUDE_MODELL: ${CLAUDE_MODELL:-}
      CODEX_MODELL: ${CODEX_MODELL:-}
      # E-13: az első rendszergazda e-mailje — belépéskor a fiók megkapja a jelölést (utána a fiókon marad)
      RENDSZERGAZDA_EMAIL: ${RENDSZERGAZDA_EMAIL:-}
      # R-17 B (0150): a logókérésről szóló e-mail — CSAK ha ki van töltve (üresen nincs levél és nincs hiba; a kérés a Logókérések listában
      # van). Az értékek a NAS .env-ből; a jelszó soha nem kerül a tárhelybe. Leírás: design/R17-visszajelzes/README.md „Levelezés”.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_BIZTONSAG: ${SMTP_BIZTONSAG:-}
      # D-13: helyi AI — a Dell Ollama-ja (Qwen); a hírfigyelő szolgáltatója és a Dell elérése
      HF_AI_SZOLGALTATO: ${HF_AI_SZOLGALTATO:-teszt}
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.1.188:11434}
      OLLAMA_MODELL: ${OLLAMA_MODELL:-qwen3.8:27b}
      HF_FUTTATO: ${HF_FUTTATO:-1}
      # E-34: hány MEGBÍZHATÓ fordított proxy van az alkalmazás előtt (DSM + a saját nginxünk = 2).
      # KIRAKÁS UTÁN MÉRNI KELL: https://saas.mediapartizan.ro/api/belso/cim — ha az "ahogy_latjuk"
      # nem a valódi külső címed, ezt az értéket kell igazítani. Rossz érték = a sebességkorlát
      # cím szerinti fele megkerülhető VAGY túl szigorú (docs/UZEMELTETES.md).
      MEGBIZHATO_PROXY_DB: ${MEGBIZHATO_PROXY_DB:-2}
      # F-6: az arculati fájlok mappája a dobozban (a NAS-on ./adatok/fajlok — a mentés része, lásd mentes.sh 4b)
      FAJL_MAPPA: /adatok/fajlok
      # c30 F9, D7 (Csilla 2026-10-17): a helyszíni fotóalbum munkapéldányai KÜLÖN mappában (a NAS-on ./adatok/album) — 30 napig élnek,
      # és NINCSENEK a mentésben (mentes.sh csak az ./adatok/fajlok-at tarolja). 30 nap után a ./adatok/album/_torolni/ alá kerülnek.
      ALBUM_MAPPA: /adatok/album
      # F-5: a kimenő értesítés webes horgának címe — a NAS .env fájljából (a vaultból), üres = semmi nem megy ki
      ERTESITES_WEBHOOK_URL: ${ERTESITES_WEBHOOK_URL:-}
      # c7 (0154): a reggeli „Tegnap javítva” üzenet a csapat Telegram-csoportjába. A token CSAK a NAS .env-ben (tools/titok/README.md);
      # a csoport azonosítója nem titok (-5557911968). Bármelyik üres → nincs üzenet, naponta egy naplósor, az alkalmazás fut tovább.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # c1 + c7 (2026-10-09 08:13): kinek szól a reggeli (tesztelő) és az esti (fejlesztő) üzenet — üresen Kati és Csilla
      TELEGRAM_TESZTELO_NEV: ${TELEGRAM_TESZTELO_NEV:-}
      TELEGRAM_FEJLESZTO_NEV: ${TELEGRAM_FEJLESZTO_NEV:-}
      # c1 (c2 kulcs): a 02:00-s visszajelzés-összesítő a Project Hub kártyájára. A kulcs CSAK a NAS .env-ben (Vilmos jóváhagyásával).
      # A hub írási címe még NYITOTT kérdés (docs/decisions/2026-10-09-c1-c7-telegram.md) — üresen nem megy ki semmi.
      HUB_FEEDBACK_URL: ${HUB_FEEDBACK_URL:-}
      HUB_WRITE_KEY: ${HUB_WRITE_KEY:-}
      HUB_SLUG: ${HUB_SLUG:-kommunikacios-munkater}
      # a Telegram-üzenet linkjének eleje (alap: https://saas.mediapartizan.ro)
      NYILVANOS_CIM: ${NYILVANOS_CIM:-}
    volumes:
      - ./adatok/fajlok:/adatok/fajlok
      - ./adatok/album:/adatok/album
    depends_on:
      - db
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
  referencia:
    build:
      context: ./forras
      dockerfile: apps/referencia-host/Dockerfile
    image: aitmetica-saas-referencia:helyi
    container_name: aitmetica-saas-referencia
    restart: unless-stopped
    environment:
      KM_REF_PROFIL: profil.nas.json
      # A helyi modell ugyanaz, amit a webalkalmazás is hív (a Dell Ollama-ja a házi hálózaton).
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.1.188:11434}
      OLLAMA_MODELL: ${OLLAMA_MODELL:-qwen3.8:27b}
    volumes:
      - referencia-adat:/adat
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
  web:
    image: nginx:alpine
    container_name: aitmetica-saas-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8400:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - app
      - referencia
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
  ai-hid:
    build:
      context: ./forras/nas/ai-hid
      dockerfile: Dockerfile
    image: aitmetica-saas-ai-hid:helyi
    container_name: aitmetica-saas-ai-hid
    restart: unless-stopped
    environment:
      PORT: "8500"
      MAX_PARHUZAMOS: "2"
      CLAUDE_MODELL: ${CLAUDE_MODELL:-}
      CODEX_MODELL: ${CODEX_MODELL:-}
    volumes:
      - ./titkok:/titkok:ro
      - ai-hid-codex:/home/node/.codex
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

volumes:
  ai-hid-codex:
  referencia-adat:
