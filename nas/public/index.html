<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Posztgyár — teszt</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f5f5f4; color:#1c1917;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; padding:24px; }
  .doboz { max-width:560px; width:100%; background:#fff; border:1px solid #e7e5e4;
           border-radius:10px; padding:32px 28px; }
  h1 { margin:0 0 4px; font-size:24px; letter-spacing:-.01em; }
  .alcim { margin:0 0 24px; color:#78716c; font-size:14px; }
  .allapot { display:inline-flex; align-items:center; gap:8px; background:#f0fdf4; color:#166534;
             border:1px solid #bbf7d0; border-radius:999px; padding:5px 12px; font-size:13px; font-weight:500; }
  .pont { width:7px; height:7px; border-radius:50%; background:#16a34a; }
  dl { margin:24px 0 0; display:grid; grid-template-columns:auto 1fr; gap:8px 20px; font-size:14px; }
  dt { color:#78716c; }
  dd { margin:0; }
  footer { margin-top:24px; padding-top:16px; border-top:1px solid #e7e5e4; color:#a8a29e; font-size:13px; }
</style>
</head>
<body>
  <main class="doboz">
    <h1>Posztgyár</h1>
    <p class="alcim">Aitmetica SRL · fejlesztés alatt</p>
    <span class="allapot"><span class="pont"></span>A tesztkörnyezet működik</span>
    <dl>
      <dt>Cím</dt><dd>saas.mediapartizan.ro</dd>
      <dt>Környezet</dt><dd>teszt, nem éles rendszer</dd>
      <dt>Keresők</dt><dd>kitiltva</dd>
    </dl>
    <footer>Ez az oldal csak azt bizonyítja, hogy a cím, a kiszolgáló és a tanúsítvány rendben van.
    Termékfunkció még nincs mögötte.</footer>
  </main>
</body>
</html>
