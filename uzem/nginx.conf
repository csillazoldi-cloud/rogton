# Rögtön — the only front door (container gma-web, host port 127.0.0.1:8410). In front of it: the Cloudflare tunnel (G7,
# container gma-tunnel on gma-kimeno). No status page, no second demo host: every path goes to the app, except robots.txt.
# G6: the app lives in the gma-egress network namespace, so it is reached as egress:3000.

# do not announce the nginx version in headers or error pages
server_tokens off;

# G7 — the real client address. Requests arrive from cloudflared (a container on a docker network, 172.16.0.0/12); Cloudflare puts
# the visitor's address in CF-Connecting-IP. nginx trusts that header ONLY from the docker range, then OVERWRITES X-Forwarded-For
# with the result (below), so the app sees exactly one address it can trust: MEGBIZHATO_PROXY_DB=1.
# Local requests (127.0.0.1:8410 through an SSH tunnel, the deploy health check) carry no such header and keep their own address.
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# G6 — resolve the app's name at request time through Docker's DNS: when gma-egress is re-created it gets a new address, and a
# name resolved once at nginx start would keep pointing at the old one (502 until a reload).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # no access log: the client IP is not stored here (the app keeps login attempts only, 30 days)
    access_log off;
    error_log /dev/stderr warn;

    # the trailing-slash redirect stays relative, so nginx never writes its own http:// host into Location
    absolute_redirect off;
    port_in_redirect off;

    # HSTS is set at the Cloudflare edge once the domain is stable (plan §9), not here.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Default request body limit: 12 MB (post images, font uploads, feedback screenshots — the code says 10 MB, nginx lets 12 MB
    # through so the CODE answers with its friendly 413 instead of an empty proxy 413).
    client_max_body_size 12m;

    # Long AI steps (post drafting, image making, website research) can take minutes; the old 60 s cut them off.
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Brand / organisation files (PDF etc.): the app caps them at 95 MB (Cloudflare edge limit ~100 MB); nginx lets 100 MB through
    # so anything over 95 MB still reaches the code and gets its friendly TUL_NAGY 413. The app streams the body to disk.
    set $app_cim http://egress:3000;

    location = /api/arculat/fajl {
        client_max_body_size 100m;
        proxy_pass $app_cim;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass $app_cim;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
